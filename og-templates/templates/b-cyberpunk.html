<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px; height: 630px;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    background: #0a0a0f;
  }

  .card {
    position: relative;
    width: 1200px; height: 630px;
    background:
      radial-gradient(circle at 75% 25%, rgba(0, 217, 255, 0.18), transparent 50%),
      radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.12), transparent 50%),
      #0a0a0f;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: #e2e8f0;
  }

  /* GPU node grid */
  .nodes {
    position: absolute; inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .nodes svg { width: 100%; height: 100%; }

  /* scanlines */
  .card::after {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 3px,
      rgba(255,255,255,0.012) 3px,
      rgba(255,255,255,0.012) 4px
    );
    pointer-events: none;
  }

  .top {
    display: flex; align-items: center; justify-content: space-between;
    position: relative; z-index: 3;
    font-family: 'SF Mono', ui-monospace, monospace;
    font-size: 14px;
  }
  .term {
    color: #64748b;
  }
  .term .prompt { color: #00d9ff; }
  .term .cmd { color: #cbd5e1; }

  .badge {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px;
    background: rgba(0, 217, 255, 0.08);
    border: 1px solid rgba(0, 217, 255, 0.3);
    border-radius: 6px;
    color: #00d9ff;
    font-size: 13px;
    letter-spacing: 1px;
  }
  .badge .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #00d9ff;
    box-shadow: 0 0 12px #00d9ff;
    animation: blink 1.5s infinite;
  }
  @keyframes blink { 50% { opacity: 0.3; } }

  .main {
    position: relative; z-index: 3;
  }

  .label {
    font-family: 'SF Mono', ui-monospace, monospace;
    font-size: 14px;
    color: #00d9ff;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  .title {
    font-size: 96px;
    font-weight: 800;
    line-height: 1.0;
    letter-spacing: -3px;
    color: #f8fafc;
    margin-bottom: 28px;
  }
  .title .grad {
    background: linear-gradient(135deg, #00d9ff 0%, #6366f1 60%, #ec4899 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    font-size: 22px;
    color: #94a3b8;
    line-height: 1.5;
    max-width: 800px;
  }
  .subtitle .pipe { color: #475569; margin: 0 12px; }
  .subtitle code {
    color: #00d9ff;
    font-family: 'SF Mono', ui-monospace, monospace;
    font-size: 19px;
  }

  .bottom {
    position: relative; z-index: 3;
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'SF Mono', ui-monospace, monospace;
    font-size: 14px;
    color: #64748b;
  }
  .bottom .url {
    color: #00d9ff;
    font-size: 18px;
    font-weight: 600;
  }
  .stats { display: flex; gap: 28px; }
  .stats .stat span { color: #cbd5e1; }
</style>
</head>
<body>
<div class="card">
  <div class="nodes">
    <svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="np" cx="50%" cy="50%">
          <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g stroke="rgba(0,217,255,0.15)" stroke-width="1" fill="none">
        <line x1="950" y1="80" x2="1080" y2="160"/>
        <line x1="1080" y1="160" x2="1020" y2="280"/>
        <line x1="1020" y1="280" x2="1120" y2="380"/>
        <line x1="1120" y1="380" x2="980" y2="450"/>
        <line x1="980" y1="450" x2="1080" y2="540"/>
        <line x1="950" y1="80" x2="1020" y2="280"/>
        <line x1="1080" y1="160" x2="1120" y2="380"/>
        <line x1="1020" y1="280" x2="980" y2="450"/>
        <line x1="60" y1="500" x2="140" y2="560"/>
        <line x1="140" y1="560" x2="240" y2="520"/>
      </g>
      <g fill="url(#np)">
        <circle cx="950" cy="80" r="14"/>
        <circle cx="1080" cy="160" r="10"/>
        <circle cx="1020" cy="280" r="12"/>
        <circle cx="1120" cy="380" r="9"/>
        <circle cx="980" cy="450" r="13"/>
        <circle cx="1080" cy="540" r="8"/>
        <circle cx="60" cy="500" r="9"/>
        <circle cx="140" cy="560" r="7"/>
        <circle cx="240" cy="520" r="10"/>
      </g>
      <g fill="#00d9ff">
        <circle cx="950" cy="80" r="3"/>
        <circle cx="1080" cy="160" r="2"/>
        <circle cx="1020" cy="280" r="3"/>
        <circle cx="1120" cy="380" r="2"/>
        <circle cx="980" cy="450" r="3"/>
        <circle cx="1080" cy="540" r="2"/>
        <circle cx="60" cy="500" r="2"/>
        <circle cx="140" cy="560" r="2"/>
        <circle cx="240" cy="520" r="2"/>
      </g>
    </svg>
  </div>

  <div class="top">
    <div class="term">
      <span class="prompt">zoe@cluster</span><span style="color:#475569">:</span><span style="color:#94a3b8">~</span><span style="color:#475569">$</span>
      <span class="cmd"> whoami --verbose</span>
    </div>
    <div class="badge">
      <div class="dot"></div>
      <span>SHIPPING</span>
    </div>
  </div>

  <div class="main">
    <div class="label">// AI INFRA ENGINEER</div>
    <div class="title">Zoe<span class="grad">.</span><span class="grad">im</span></div>
    <div class="subtitle">
      <code>LLM Serving</code><span class="pipe">/</span><code>GPU Cluster</code><span class="pipe">/</span><code>RDMA</code><br>
      用代码和 AI 搭建可持续的收入系统 — shipping passive income, one repo at a time.
    </div>
  </div>

  <div class="bottom">
    <div>
      <span class="url">→ zoe.im</span>
      <span style="margin-left:16px">github.com/jiusanzhou</span>
    </div>
    <div class="stats">
      <div class="stat">build <span>· flutter_floatwing</span></div>
      <div class="stat">next <span>· wuma.dev</span></div>
    </div>
  </div>
</div>
</body>
</html>
