<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>OG · Template A · Minimal Card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px; height: 630px;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #fafafa;
    overflow: hidden;
  }
  .card {
    position: relative;
    width: 1200px; height: 630px;
    background:
      radial-gradient(circle at 85% 15%, rgba(0, 217, 255, 0.08), transparent 45%),
      radial-gradient(circle at 10% 90%, rgba(99, 102, 241, 0.06), transparent 50%),
      linear-gradient(180deg, #ffffff 0%, #f5f7fa 100%);
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .card::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(15,23,42,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15,23,42,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }
  .top { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .avatar {
    width: 76px; height: 76px;
    border-radius: 50%;
    background: linear-gradient(135deg, #06b6d4, #6366f1);
    padding: 3px;
    box-shadow: 0 8px 24px rgba(6, 182, 212, 0.25);
  }
  .avatar img {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    border: 2px solid white;
  }
  .brand-name { font-size: 30px; font-weight: 700; color: #0f172a; letter-spacing: -0.5px; }
  .brand-domain { font-size: 16px; color: #64748b; font-family: 'SF Mono', ui-monospace, monospace; margin-top: 2px; }
  .status {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 18px;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(15,23,42,0.08);
    border-radius: 999px;
    font-size: 15px; color: #475569;
    font-family: 'SF Mono', ui-monospace, monospace;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15); }
  .main { position: relative; z-index: 2; margin-top: 30px; }
  .greet { font-size: 28px; color: #64748b; margin-bottom: 18px; font-weight: 500; }
  .title { font-size: 88px; font-weight: 800; line-height: 1.05; letter-spacing: -3px; color: #0f172a; margin-bottom: 22px; }
  .title .accent {
    background: linear-gradient(90deg, #06b6d4, #6366f1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .tags { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
  .tag {
    padding: 10px 22px; background: white;
    border: 1.5px solid #e2e8f0; border-radius: 12px;
    font-size: 18px; color: #334155; font-weight: 600;
    box-shadow: 0 2px 8px rgba(15,23,42,0.04);
  }
  .tag.primary { background: #0f172a; color: white; border-color: #0f172a; }
  .tag .em { color: #06b6d4; margin-right: 6px; }
  .bottom {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid rgba(15,23,42,0.08); padding-top: 24px;
  }
  .quote { font-size: 18px; color: #475569; font-style: italic; max-width: 760px; line-height: 1.5; }
  .quote::before {
    content: '"'; color: #06b6d4; font-size: 32px; font-style: normal;
    margin-right: 4px; line-height: 0; position: relative; top: 4px;
  }
  .meta { text-align: right; font-family: 'SF Mono', ui-monospace, monospace; font-size: 14px; color: #94a3b8; }
  .meta strong { color: #0f172a; font-size: 16px; display: block; margin-bottom: 2px; }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="brand">
      <div class="avatar" data-bind="brand.initial"><img src="avatar.jpg" alt="Zoe"></div>
      <div>
        <div class="brand-name" data-bind="brand.name">Zoe</div>
        <div class="brand-domain" data-bind="brand.domain">zoe.im</div>
      </div>
    </div>
    <div class="status">
      <div class="dot"></div>
      <span data-bind="status">shipping · Hangzhou</span>
    </div>
  </div>

  <div class="main">
    <div class="greet" data-bind="headline.greeting">👋 Hey, 我是 Zoe ——</div>
    <div class="title">
      <span data-bind="headline.lineA">调</span>
      <span class="accent" data-bind="headline.accentA">GPU 集群</span><br>
      <span data-bind="headline.lineB">造被动收入</span>
    </div>
    <div class="tags" data-each="tags" data-template="tag">
      <div class="tag primary"><span style="color:#06b6d4">▸</span> AI Infra Engineer</div>
      <div class="tag"><span class="em">●</span> LLM Serving</div>
      <div class="tag"><span class="em">●</span> GPU / RDMA</div>
      <div class="tag"><span class="em">●</span> Indie Hacker</div>
    </div>
  </div>

  <div class="bottom">
    <div class="quote" data-bind="quote">任何业务逻辑都应向「无码平台」演进。</div>
    <div class="meta">
      <strong data-bind="brand.github">github.com/jiusanzhou</strong>
      © <span data-bind="brand.since">2011</span> — present
    </div>
  </div>
</div>
</body>
</html>
