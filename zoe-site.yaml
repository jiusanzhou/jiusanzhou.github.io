    quote: 任何业务逻辑都应向「无码平台」演进。
    cite: Zoe · 长期信仰
    link:
      text: wuma.dev
      href: https://wuma.dev
    align: center

  - title: 在做什么
    description: 当前聚焦的方向
    items:
      - icon: '🚀'
        title: AI Infra & LLM Serving
        description: 在大型互联网公司负责自研推理平台。vLLM / SGLang / GPU 集群调度 / RDMA / PD 分离。每天跟大模型推理打交道。
      - icon: '🛠'
        title: AI Ops 工具
        description: 多 Agent 系统、内容分发 CLI、手机端 AI Agent。解决自己的问题，然后开源。
      - icon: '💰'
        title: 被动收入实验
        description: 从零开始搭建被动收入系统，每月公开数据报告。

