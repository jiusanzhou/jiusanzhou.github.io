        - title: All projects
          category: Open Source
          href: /projects
        - title: RSS
          category: Subscribe
          href: /rss.xml

      blog:
        title: Blog
        description: Code, tools, and notes from the trenches

      hero:
        greeting: '👋 Hey, I''m Zoe'
        typingTexts:
          - serving LLMs at scale
          - shipping AI ops tools
          - tuning GPU clusters
          - helping teams ship AI
        description: 'AI Infra Engineer · LLM Serving / GPU / RDMA · I help teams take AI from demo to production — and ship my own tools along the way.'
        cta:
          - text: Let's work together
            href: '#services'
          - text: Read the blog
            href: /blog
          - text: GitHub
            href: https://github.com/jiusanzhou

      sections:
        - type: quote
          quote: Every piece of business logic should eventually evolve into a "no-code platform."
          cite: Zoe · a long-held belief
          link:
            text: wuma.dev
            href: https://wuma.dev
          align: center

        - title: What I'm working on
          description: Where my hours go right now
          position: center
          items:
            - icon: '🚀'
              title: AI Infra & LLM Serving
              description: Running an in-house inference platform at a top-tier internet company. vLLM / SGLang, GPU cluster scheduling, RDMA, P/D disaggregation. Days deep in the guts of large-model serving.
            - icon: '🛠'
              title: AI Ops tools
              description: Multi-agent systems, content distribution CLIs, mobile AI agents. I scratch my own itches first, then open-source whatever's left.
            - icon: '💰'
              title: Indie revenue experiments
              description: Bootstrapping passive income from zero — products, content, automation. Public monthly numbers, no fluff.

        - type: features
          id: services
          title: How I can help
          description: Hands-on AI infra & product engineering — from your first inference cluster to your first paying users.
          columns: 3
          style: cards
          items:
            - icon: '🧠'
              title: LLM Serving & Inference
              description: Stand up a production-grade inference platform on your own GPUs. vLLM / SGLang, P/D disaggregation, RDMA, autoscaling. Cut latency, cut cost.
            - icon: '🤖'
              title: AI Agents & Workflows
              description: Multi-agent systems, RAG pipelines, internal copilots. From ChatGPT-style assistants to autonomous agents that actually do the work.
            - icon: '🚀'
              title: Product Engineering
              description: AI-first SaaS, landing pages, dev tools. Idea to live product in weeks — Next.js / Cloudflare / Supabase stack I use every day.

        - type: cta
          style: gradient
          title: Have an AI project that's stuck?
          description: Whether you need an architecture review, a hands-on engineer for 4 weeks, or a partner to ship a v1 — let's talk.
          cta:
            - text: Email me
              href: mailto:hi@zoe.im
            - text: Telegram
              href: https://t.me/noboddyim
              variant: outline

        - type: posts
          title: Latest posts
          description: Code, tools, and notes from the trenches
          limit: 6
          mode: grid

        - type: products
          title: Independent products
          description: Things I've shipped — live, building, dreaming
          limit: 6

        - type: projects
          title: Open-source projects
          description: My open-source work and portfolio
          limit: 6

